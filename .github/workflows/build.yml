name: build-firmware

# Full OpenWrt source build (x86_64 Ubuntu runner).
# ImageBuilder cannot emit per-device initramfs-kernel.bin, so we build
# from source. Uses proxy profile friendlyarm_nanopi-m1-plus until
# Device/focalcrest_gearhub + DTS patch land, plus our dtc-compiled DTB.
on:
  push:
    paths-ignore:
      - README.md
      - ROADMAP.md
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions: {}

# One build at a time per branch; a new push cancels the stale one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sunxi:
    name: Full source build (sunxi/cortexa7)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OPENWRT_VERSION: "25.12.6"
      PROFILE: friendlyarm_nanopi-m1-plus
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: gearhub

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            device-tree-compiler u-boot-tools

      - name: Compile and validate GearHub DTB & boot.scr
        run: |
          mkdir -p artifacts
          dtc -I dts -O dtb -o artifacts/sun8i-h3-focalcrest-gearhub.dtb \
            gearhub/openwrt/target/sunxi/dts/sun8i-h3-focalcrest-gearhub.dts
          mkimage -C none -A arm -T script -d gearhub/boot/boot-openwrt.cmd artifacts/boot.scr

      - name: Clone OpenWrt
        run: |
          git clone --branch "v${OPENWRT_VERSION}" --depth 1 \
            https://github.com/openwrt/openwrt.git openwrt
          mkdir -p openwrt/.ccache

      - name: Cache OpenWrt downloads (dl/)
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-dl-${{ env.OPENWRT_VERSION }}-${{ hashFiles('gearhub/.github/workflows/build.yml') }}
          restore-keys: |
            openwrt-dl-${{ env.OPENWRT_VERSION }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: openwrt/.ccache
          key: openwrt-ccache-${{ env.OPENWRT_VERSION }}-${{ github.run_id }}
          restore-keys: |
            openwrt-ccache-${{ env.OPENWRT_VERSION }}-

      - name: Feeds update + install
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Seed target config
        working-directory: openwrt
        run: |
          {
            echo "CONFIG_GPIO_WATCHDOG=y"
            echo "CONFIG_GPIO_WATCHDOG_ARCH_INITCALL=y"
            echo "CONFIG_SERIAL_DEV_BUS=y"
            echo "CONFIG_SERIAL_DEV_CTRL_TTYPORT=y"
            echo "CONFIG_BT_HCIUART_SERDEV=y"
            echo "CONFIG_BT_HCIUART_BCM=y"
          } >> target/linux/sunxi/config-6.12
          cat > .config <<EOF
          CONFIG_TARGET_sunxi=y
          CONFIG_TARGET_sunxi_cortexa7=y
          CONFIG_TARGET_sunxi_cortexa7_DEVICE_${PROFILE}=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_CCACHE=y
          CONFIG_CCACHE_DIR="${{ github.workspace }}/openwrt/.ccache"
          CONFIG_PACKAGE_ser2net=y
          CONFIG_PACKAGE_uboot-envtools=y
          CONFIG_PACKAGE_gpiod-tools=y
          CONFIG_PACKAGE_kmod-rtc-sunxi=y
          CONFIG_PACKAGE_kmod-rtc-pcf8563=y
          CONFIG_PACKAGE_kmod-spi-dev=y
          CONFIG_PACKAGE_kmod-bluetooth=y
          CONFIG_PACKAGE_bluez-utils=y
          EOF
          make defconfig

      - name: Apply files overlay
        run: |
          cp -r gearhub/files openwrt/files

      - name: Build images
        working-directory: openwrt
        env:
          CCACHE_DIR: ${{ github.workspace }}/openwrt/.ccache
          CCACHE_MAXSIZE: 2G
        run: make -j"$(nproc)"

      - name: Collect artifacts
        run: |
          cp openwrt/bin/targets/sunxi/cortexa7/*"${PROFILE}"*initramfs* artifacts/ 2>/dev/null || true
          cp openwrt/bin/targets/sunxi/cortexa7/*"${PROFILE}"*sysupgrade.bin artifacts/ 2>/dev/null || true
          cp openwrt/bin/targets/sunxi/cortexa7/*"${PROFILE}"*sdcard.img.gz artifacts/ 2>/dev/null || true
          cp openwrt/build_dir/target-*/linux-sunxi_cortexa7/zImage artifacts/openwrt-gearhub-zImage 2>/dev/null || true
          cp openwrt/bin/targets/sunxi/cortexa7/*.manifest artifacts/ 2>/dev/null || true
          cp openwrt/bin/targets/sunxi/cortexa7/sha256sums artifacts/ 2>/dev/null || true
          ls -lh artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-sunxi-images
          path: artifacts/*
          compression-level: 9
          if-no-files-found: error

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --clobber \
            artifacts/*
